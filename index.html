
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotina — Inglês todo dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7ECE7; --paper: #FFF9F6; --ink: #331F1A; --ink-soft: #8A6A61; --line: #EAD3CA;
    --blue: #B23A2E; --amber: #C98F3F; --coral: #7A2620; --green: #4A7A45; --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:.02em; }
  .app{ display:grid; grid-template-columns: 280px 1fr; min-height:100vh; }
  @media (max-width: 860px){ .app{ grid-template-columns: 1fr; } .sidebar{ position:static; border-right:none; border-bottom:1px solid var(--line); height:auto; } }
  .sidebar{ background:var(--paper); border-right:1px solid var(--line); padding:28px 22px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .brand h1{ font-size:1.4rem; }
  .brand span{ color:var(--coral); font-family:'Fraunces', serif; font-style:italic; font-size:1.4rem; }
  .tagline{ color:var(--ink-soft); font-size:.85rem; margin-bottom:28px; }
  .streak{ display:flex; align-items:center; gap:10px; background:#F5DED4; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:26px; }
  .streak .num{ font-family:'Fraunces', serif; font-size:1.6rem; color:var(--amber); line-height:1;}
  .streak .label{ font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .nav-label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin: 18px 0 10px; display:flex; justify-content:space-between; }
  .day-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; max-height:480px; overflow-y:auto; }
  .day-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:.92rem; color:var(--ink-soft); border:none; background:none; width:100%; text-align:left; font-family:'Work Sans', sans-serif; }
  .day-item .dot{ width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .day-item.active{ background:#F6E1D9; color:var(--ink); font-weight:500; }
  .day-item.active .dot{ background:var(--blue); }
  .day-item.done .dot{ background:#A6763B; }
  .day-item .n{ font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:var(--ink-soft); min-width:22px; }
  .day-item .topic{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main{ padding:44px 48px 80px; max-width:920px; }
  @media (max-width: 640px){ main{ padding:28px 20px 60px; } }
  .lesson-header{ margin-bottom:34px; }
  .eyebrow{ color:var(--ink-soft); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .lesson-header h2{ font-size:2.1rem; }
  .lesson-sub{ color:var(--ink-soft); margin-top:8px; font-size:1rem; }
  .dict-box{ display:flex; gap:16px; align-items:flex-start; background:var(--paper); border:1.5px solid var(--blue); border-radius:16px; padding:18px 22px; margin-bottom:24px; }
  .dict-icon{ font-size:1.3rem; margin-top:6px; }
  .dict-body{ flex:1; }
  .dict-input{ width:100%; border:none; border-bottom:2px solid var(--line); font-family:'Fraunces', serif; font-size:1.3rem; padding:6px 2px; background:transparent; color:var(--ink); }
  .dict-input:focus{ outline:none; border-bottom-color:var(--blue); }
  .dict-result{ margin-top:10px; font-size:.92rem; color:var(--ink-soft); min-height:1.3em; }
  .dict-result .found{ color:var(--ink); }
  .dict-result .found strong{ color:var(--blue); font-family:'Fraunces', serif; font-size:1.05rem; }
  .dict-result .not-found{ color:var(--coral); }
  .dict-result .loading{ color:var(--amber); }
  .dict-result .src{ color:var(--ink-soft); font-size:.78rem; font-style:italic; }
  .dial-row{ display:flex; align-items:center; gap:28px; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:24px 28px; margin-bottom:40px; }
  @media (max-width:640px){ .dial-row{ flex-direction:column; align-items:flex-start; } }
  .dial-wrap{ flex-shrink:0; }
  .dial-legend{ display:flex; flex-direction:column; gap:10px; }
  .legend-item{ display:flex; align-items:center; gap:9px; font-size:.9rem; }
  .swatch{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .legend-time{ color:var(--ink-soft); margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:.8rem; }
  @media (max-width:640px){ .legend-time{ margin-left:0; } }
  .start-btn{ margin-bottom:24px; background:var(--ink); color:var(--paper); border:none; padding:14px 26px; border-radius:10px; font-size:.95rem; font-weight:500; cursor:pointer; font-family:'Work Sans', sans-serif; }
  .start-btn:hover{ background:#4A2A22; }
  .start-btn:focus-visible, .day-item:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .lesson-block{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:28px 30px; margin-bottom:24px; }
  .block-tag{ display:inline-block; color:#fff; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:5px 12px; border-radius:20px; margin-bottom:14px; }
  .block-title{ font-size:1.5rem; margin-bottom:14px; }
  .explain{ color:var(--ink-soft); line-height:1.65; font-size:.95rem; margin:0 0 16px; }
  .mini-h{ font-family:'Fraunces', serif; font-size:1.05rem; margin:22px 0 12px; }
  .tip-box{ background:#FBF0DE; border-left:3px solid var(--amber); border-radius:8px; padding:12px 16px; font-size:.9rem; color:var(--ink); margin:0 0 18px; }
  .tip-box strong{ color:var(--amber); }
  .mistake-box{ background:#FBE9E5; border-left:3px solid var(--coral); border-radius:8px; padding:12px 16px; font-size:.9rem; color:var(--ink); margin:0 0 10px; }
  .mistake-box .wrong{ color:var(--coral); text-decoration:line-through; }
  .mistake-box .right{ color:var(--green); font-weight:600; }
  .reorder-box{ background:#FBF3EF; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .reorder-words{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .reorder-words .chip{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .reorder-box input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:.92rem; font-family:'Work Sans', sans-serif; margin-bottom:8px; }
  .chip{ display:inline-block; background:#F3E4DC; color:var(--coral); padding:3px 9px; border-radius:6px; font-size:.82rem; margin:2px 3px 2px 0; }
  .example-list{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .example-list li{ display:flex; justify-content:space-between; gap:16px; font-size:.94rem; padding:8px 12px; background:#FBF3EF; border-radius:8px; flex-wrap:wrap; }
  .example-list .en{ color:var(--ink); }
  .example-list .pt{ color:var(--ink-soft); font-style:italic; }
  .quiz .q{ margin-bottom:12px; font-size:.98rem; }
  .blank{ width:70px; text-align:center; font-family:'IBM Plex Mono', monospace; border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:.9rem; background:#fff; }
  .blank.correct{ border-color:var(--green); background:#EAF3E8; }
  .blank.wrong{ border-color:var(--coral); background:#FBE9E5; }
  .q-choice{ margin-bottom:14px; font-size:.95rem; }
  .q-choice label{ display:inline-flex; align-items:center; gap:6px; margin-right:18px; color:var(--ink-soft); }
  .check-btn{ background:var(--blue); color:#fff; border:none; padding:9px 18px; border-radius:8px; font-size:.85rem; cursor:pointer; font-family:'Work Sans', sans-serif; margin-top:6px; }
  .quiz-feedback{ margin-top:10px; font-size:.9rem; font-weight:500; min-height:1.2em; }
  .dialogue{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .line{ display:flex; align-items:center; gap:12px; font-size:.94rem; }
  .play-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; flex-shrink:0; color:var(--blue); font-size:.8rem; }
  .play-btn-wide{ background:var(--paper); border:1px solid var(--blue); color:var(--blue); padding:9px 16px; border-radius:8px; cursor:pointer; font-size:.85rem; font-family:'Work Sans', sans-serif; }
  .reading-text{ font-size:1.05rem; line-height:1.9; margin-bottom:14px; }
  .reading-text mark{ background:#F5DDA0; padding:1px 3px; border-radius:3px; }
  .vocab-table{ width:100%; border-collapse:collapse; font-size:.92rem; margin-top:8px; }
  .vocab-table th{ text-align:left; color:var(--ink-soft); font-weight:500; font-size:.76rem; text-transform:uppercase; letter-spacing:.04em; padding:7px 10px; border-bottom:1px solid var(--line); }
  .vocab-table td{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .vocab-table td:first-child{ font-family:'IBM Plex Mono', monospace; color:var(--blue); }
  .challenge{ background:#FBF3EF; border:1px dashed var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .challenge p{ margin:0 0 8px; font-size:.93rem; }
  .challenge input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:.92rem; font-family:'Work Sans', sans-serif; margin-bottom:8px; }
  .reveal-btn{ background:none; border:1px solid var(--amber); color:var(--amber); padding:6px 14px; border-radius:8px; font-size:.8rem; cursor:pointer; font-family:'Work Sans', sans-serif; }
  .reveal-answer{ margin-top:8px; font-size:.9rem; color:var(--green); display:none; }
  .speak-card{ background:#FBF3EF; border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
  .target-phrase{ font-family:'Fraunces', serif; font-size:1.2rem; margin-bottom:16px; }
  .speak-controls{ display:flex; gap:12px; flex-wrap:wrap; }
  .record-btn{ background:var(--coral); color:#fff; border:none; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:.85rem; font-family:'Work Sans', sans-serif; }
  .record-btn.recording{ background:#8C231C; }
  .speak-result{ margin-top:14px; font-size:.92rem; color:var(--ink-soft); }
  .complete-row{ display:flex; align-items:center; gap:16px; margin-top:8px; flex-wrap:wrap; }
  .complete-btn{ background:var(--green); color:#fff; border:none; padding:13px 24px; border-radius:10px; font-size:.92rem; font-weight:500; cursor:pointer; font-family:'Work Sans', sans-serif; }
  .complete-btn:disabled{ background:#B9C2AE; cursor:default; }
  .complete-msg{ font-size:.88rem; color:var(--ink-soft); }
  .nav-buttons{ display:flex; gap:10px; margin-top:22px; }
  .nav-buttons button{ background:var(--paper); border:1px solid var(--line); padding:10px 18px; border-radius:8px; cursor:pointer; font-size:.85rem; color:var(--ink); font-family:'Work Sans', sans-serif; }
  .nav-buttons button:hover{ border-color:var(--blue); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>Rotina</h1><span>en</span></div>
    <p class="tagline">50 minutos por dia. Nível A1 → A2.</p>
    <div class="streak">
      <div class="num mono" id="streakNum">0</div>
      <div class="label">dias seguidos</div>
    </div>
    <div class="nav-label"><span>Sua trilha</span><span id="progressLabel" class="mono">0/30</span></div>
    <ul class="day-list" id="dayList"></ul>
    <button id="verbGuideBtn" class="day-item" style="margin-top:16px;border-top:1px solid var(--line);padding-top:16px;font-weight:500;">📖 Guia de Verbos (consulta)</button>
  </aside>
  <main>
    <div class="dict-box">
      <div class="dict-icon">🔎</div>
      <div class="dict-body">
        <input type="text" id="dictInput" class="dict-input" placeholder="Digite uma palavra em inglês..." autocomplete="off">
        <div class="dict-result" id="dictResult">Traduzo qualquer palavra em inglês — na hora.</div>
      </div>
    </div>
    <div class="lesson-header">
      <div class="eyebrow" id="dayEyebrow">Dia 1 · Nível A1</div>
      <h2 id="lessonTitle">Greetings &amp; Introductions</h2>
      <p class="lesson-sub" id="lessonSub"></p>
    </div>
    <div class="dial-row">
      <div class="dial-wrap">
        <svg id="dial" width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#E4E7DC" stroke-width="12"/>
          <g id="dialArcs"></g>
          <text x="60" y="56" text-anchor="middle" font-family="Fraunces, serif" font-size="22" fill="#331F1A">50</text>
          <text x="60" y="74" text-anchor="middle" font-family="Work Sans, sans-serif" font-size="10" fill="#8A6A61">minutos</text>
        </svg>
      </div>
      <div class="dial-legend">
        <div class="legend-item"><span class="swatch" style="background:#B23A2E"></span>Gramática<span class="legend-time">20 min</span></div>
        <div class="legend-item"><span class="swatch" style="background:#C98F3F"></span>Escuta &amp; leitura<span class="legend-time">20 min</span></div>
        <div class="legend-item"><span class="swatch" style="background:#7A2620"></span>Expressão oral<span class="legend-time">10 min</span></div>
      </div>
    </div>
    <button class="start-btn" id="startBtn">Começar aula</button>
    <section id="lessonContent" style="display:none;"></section>
  </main>
</div>
<script>
/* ============ CONTEÚDO DAS 30 AULAS (versão expandida) ============ */
const lessons = {
1:{ topic:"Alfabeto e primeiras palavras", title:"The Alphabet & First Words", sub:"Começando do zero: letras, sons e cortesia básica.",
  grammarTitle:"O alfabeto em inglês e palavras de cortesia",
  grammarHtml:"O inglês usa as mesmas 26 letras do português, mas muitos sons são diferentes. Antes de qualquer gramática, você precisa das palavras que abrem e fecham qualquer conversa: cumprimentos e cortesia. Essas palavras não mudam nunca, então são o primeiro degrau real do idioma.",
  tip:"A letra 'H' em inglês tem som (parecido com um 'RR' fraco saindo pela boca, como em 'hello'), diferente do português onde H é mudo. E o 'R' em inglês nunca vibra como em 'carro' — é mais suave, quase como uma vogal.",
  examples:[["Hello! / Hi!","Olá! / Oi!"],["Good morning!","Bom dia!"],["Good afternoon!","Boa tarde!"],["Good night!","Boa noite! (despedida)"],["Please.","Por favor."],["Thank you very much.","Muito obrigado(a)."],["You're welcome.","De nada."],["Excuse me.","Com licença / desculpe (para chamar atenção)."],["I'm sorry.","Eu sinto muito / desculpe (para erro/pesar)."],["See you later!","Até mais!"]],
  fill:[["","Please"," , can you help me?"],["Thank you "," very"," much."],["","Excuse"," me, where is the bank?"],["I'm "," sorry"," for being late."],["","Good"," morning, everyone!"]],
  choice:[{q:"Usado para pedir passagem ou chamar atenção de alguém:",opts:[["Excuse me",1],["I'm sorry",0]]},{q:"Usado quando você cometeu um erro ou magoou alguém:",opts:[["Excuse me",0],["I'm sorry",1]]},{q:"Resposta educada para 'Thank you':",opts:[["You're welcome",1],["Please",0]]},{q:"Saudação usada à noite, ao chegar (não ao sair):",opts:[["Good night",0],["Good evening",1]]}],
  challenge:[["Muito obrigado, e até mais!","Thank you very much, and see you later!"],["Com licença, você pode me ajudar, por favor?","Excuse me, can you help me, please?"],["Bom dia! Como você está?","Good morning! How are you?"]],
  dialogue:[["Anna","Good morning! How are you today?"],["Marcos","Good morning, Anna! I'm fine, thank you. And you?"],["Anna","I'm great, thanks! Excuse me, I need to go now."],["Marcos","No problem! See you later."],["Anna","Thank you, see you soon!"],["Marcos","You're welcome, bye!"]],
  listenQ:[{q:"How does Marcos feel today?",opts:[["Fine",1],["Tired",0]]},{q:"Why does Anna say 'Excuse me'?",opts:[["She needs to leave",1],["She made a mistake",0]]},{q:"How do they say goodbye?",opts:[["See you later / See you soon",1],["Good night",0]]}],
  readingHtml:"Every day, Marcos says <mark>good morning</mark> to his neighbors. He always says <mark>please</mark> and <mark>thank you</mark>, because good manners matter everywhere. When he makes a mistake, he says <mark>I'm sorry</mark>. When he needs attention, he says <mark>excuse me</mark>.",
  vocab:["hello","please","thank you","sorry","excuse me","good morning","you're welcome","see you later"],
  speak:"Good morning! Thank you very much, and see you later!" },

2:{ topic:"Números e cores", title:"Numbers & Colors", sub:"Contando de 0 a 12 e nomeando cores básicas.",
  grammarTitle:"Números (0-12) e cores",
  grammarHtml:"Números e cores são blocos básicos de qualquer frase — você vai usá-los para dizer idade, horas, preços, quantidades e para descrever qualquer objeto. Aprenda-os de cor (literalmente!), porque eles aparecem em praticamente toda conversa do dia a dia.",
  tip:"Cuidado com a pronúncia: 'thirteen' (13) e 'thirty' (30) soam parecidos para iniciantes — a diferença está na sílaba tônica. Em '13', o final '-teen' é mais forte; em '30', o começo 'thir-' é mais forte.",

  fill:[["I have "," three"," books."],["The car is "," red","."],["She has "," two"," brothers."],["My favorite color is "," blue","."],["I count from "," zero"," to ten."]],
  choice:[{q:"7 in English:",opts:[["seven",1],["six",0]]},{q:"The color of grass:",opts:[["green",1],["yellow",0]]},{q:"9 in English:",opts:[["nine",1],["five",0]]},{q:"The color of the sky:",opts:[["blue",1],["brown",0]]}],
  challenge:[["Eu tenho três maçãs vermelhas.","I have three red apples."],["Qual é a sua cor favorita?","What is your favorite color?"],["Ela tem cinco livros azuis.","She has five blue books."]],
  dialogue:[["Marcos","How many brothers do you have?"],["Anna","I have one brother and two sisters."],["Marcos","What's your favorite color?"],["Anna","I like blue. What about you?"],["Marcos","I like green and red."],["Anna","Nice! Green is a beautiful color."]],
  listenQ:[{q:"How many brothers does Anna have?",opts:[["One",1],["Two",0]]},{q:"What is Anna's favorite color?",opts:[["Blue",1],["Green",0]]},{q:"What colors does Marcos like?",opts:[["Green and red",1],["Blue and yellow",0]]}],
  readingHtml:"Anna has one <mark>brother</mark> and two sisters — three siblings in total. Her favorite <mark>color</mark> is <mark>blue</mark>, like the sky. Marcos likes <mark>green</mark> and <mark>red</mark>. Together they counted <mark>ten</mark> colorful birds in the park.",

3:{ topic:"Pronomes pessoais e sala de aula", title:"Personal Pronouns & Classroom", sub:"I, you, he, she... e o vocabulário básico da sala de aula.",
  grammarTitle:"Pronomes pessoais",
  grammarHtml:"Pronomes pessoais substituem nomes de pessoas ou coisas: <strong>I</strong> (eu), <strong>you</strong> (você), <strong>he</strong> (ele), <strong>she</strong> (ela), <strong>it</strong> (ele/ela para objetos e animais), <strong>we</strong> (nós), <strong>they</strong> (eles/elas). Eles são a base de toda frase em inglês — sem eles, não dá para conjugar nenhum verbo corretamente.",

  vocab:["pen","pencil","table","chair","door","window","classroom"],

4:{ topic:"To be & saudações", title:"Greetings & Introductions", sub:"O verbo to be e como se apresentar.",
  grammarTitle:"O verbo to be",

  tip:"Contrações são essenciais para soar natural: I'm, you're, he's, she's, we're, they're. Nativos quase nunca falam 'I am' completo em conversas informais.",

  dialogue:[["Anna","Hi! My name is Anna. What is your name?"],["Marcos","Hello Anna, I am Marcos. Nice to meet you."],["Anna","Nice to meet you too. Are you a student?"],["Marcos","Yes, I am. I am from Brazil."],["Anna","That's great! Is this your first time in Canada?"],["Marcos","Yes, it is. I am very excited."]],
  listenQ:[{q:"What is the woman's name?",opts:[["Marcos",0],["Anna",1]]},{q:"Where is Marcos from?",opts:[["Brazil",1],["Portugal",0]]},{q:"Is this Marcos's first time in Canada?",opts:[["Yes",1],["No",0]]}],
  readingHtml:"My name is <strong>Marcos</strong>. I <mark>am</mark> from Brazil. I <mark>am</mark> a student. My friend <mark>is</mark> Anna. She <mark>is</mark> from Canada. We <mark>are</mark> classmates. This <mark>is</mark> my first trip abroad, and I <mark>am</mark> very happy to be here.",
  vocab:["friend","classmate","student","from","abroad","excited"],

  dialogue:[["Anna","Where is the coffee shop?"],["Marcos","It's on Main Street, near the park."],["Anna","Is it in the city center?"],["Marcos","Yes, it's at the corner of Main and 2nd."],["Anna","Perfect, I'll meet you there at noon."],["Marcos","Sounds good, see you at the coffee shop!"]],

  readingHtml:"Marcos's house is <mark>in</mark> São Paulo. His room is <mark>on</mark> the second floor. His books are <mark>on</mark> the shelf, and his backpack is <mark>at</mark> the door, ready for school. Every morning, he waits <mark>at</mark> the bus stop <mark>on</mark> the corner.",
  vocab:["shelf","backpack","corner","floor","entrance","nearby"],

  listenQ:[{q:"What pets does Anna have?",opts:[["A cat and a dog",1],["Only a cat",0]]},{q:"What is the cat's name?",opts:[["Luna",1],["Anna",0]]},{q:"What is the dog's name?",opts:[["Max",1],["Luna",0]]}],
  readingHtml:"Anna has <mark>a</mark> cat and <mark>an</mark> old dog. <mark>The</mark> cat, Luna, sleeps all day. <mark>The</mark> dog, Max, is very active and loves <mark>a</mark> long walk every morning. It takes about <mark>an</mark> hour.",

  dialogue:[["Anna","How many brothers do you have?"],["Marcos","I have two brothers and one sister."],["Anna","Wow, three siblings!"],["Marcos","Yes, and five cousins too."],["Anna","Big family! Do you all live in the same city?"],["Marcos","No, we live in three different cities."]],
  listenQ:[{q:"How many brothers does Marcos have?",opts:[["Two",1],["Three",0]]},{q:"How many cousins?",opts:[["Five",1],["Two",0]]},{q:"How many cities do they live in?",opts:[["Three",1],["One",0]]}],
  readingHtml:"Marcos has two <mark>brothers</mark> and one <mark>sister</mark>. He also has five <mark>cousins</mark> and four <mark>friends</mark> from school who visit every weekend. His family lives in three different <mark>cities</mark>, but they always meet during holidays.",
  vocab:["siblings","cousins","brothers","weekend","people","cities"],

8:{ topic:"Pronomes possessivos", title:"Possessives", sub:"my, your, his, her, our, their.",
  grammarTitle:"Pronomes possessivos",
  grammarHtml:"Usamos possessivos antes de um substantivo para mostrar posse: <strong>my</strong> (meu), <strong>your</strong> (seu), <strong>his/her</strong> (dele/dela), <strong>our</strong> (nosso), <strong>their</strong> (deles). Diferente do português, não concordam em gênero com o objeto — 'his car' e 'his house' usam o mesmo 'his'.",
  tip:"Não confunda 'its' (possessivo de 'it', sem apóstrofo) com 'it's' (contração de 'it is'). Isso engana até estudantes avançados!",
  examples:[["This is my book.","Este é meu livro."],["Is that your car?","Aquele é seu carro?"],["Her name is Anna.","O nome dela é Anna."],["Their house is big.","A casa deles é grande."],["The dog wagged its tail.","O cachorro balançou o rabo."],["Our team won the game.","Nosso time ganhou o jogo."]],
  fill:[["This is "," my"," phone."],["Is that "," your"," bag?"],["That is "," her"," jacket."],["The cat licked "," its"," paw."],["This is "," our"," classroom."]],
  choice:[{q:"That is ___ dog (belongs to him).",opts:[["his",1],["her",0]]},{q:"This is ___ classroom (belongs to us).",opts:[["their",0],["our",1]]},{q:"The cat lost ___ toy.",opts:[["it's",0],["its",1]]}],
  challenge:[["Este é o carro dela, não o meu.","This is her car, not mine."],["Nossa casa é perto da escola.","Our house is near the school."]],
  dialogue:[["Marcos","Is this your notebook?"],["Anna","No, it's not my notebook. It's his."],["Marcos","Whose bag is this, then?"],["Anna","That's our teacher's bag."],["Marcos","And that jacket over there?"],["Anna","That's her jacket, she left it yesterday."]],
  listenQ:[{q:"Whose notebook is it?",opts:[["His",1],["Anna's",0]]},{q:"Whose bag is it?",opts:[["The teacher's",1],["Marcos's",0]]},{q:"Whose jacket is on the chair?",opts:[["Hers",1],["His",0]]}],
  readingHtml:"Every student has <mark>their</mark> own notebook. Marcos keeps <mark>his</mark> notebook in <mark>his</mark> backpack. Anna keeps <mark>her</mark> notebook on <mark>her</mark> desk at home. <mark>Our</mark> classroom always has extra pens for students who forget <mark>their</mark> own.",
  vocab:["notebook","desk","whose","teacher","forget","jacket"],
  speak:"This is my notebook, and that is her bag over there." },

  challenge:[["Há um banco perto da minha casa.","There is a bank near my house."],["Não há assentos suficientes na sala.","There aren't enough seats in the room."]],
  dialogue:[["Anna","Is there a supermarket near here?"],["Marcos","Yes, there is one on Elm Street."],["Anna","Are there any pharmacies too?"],["Marcos","Yes, there are two, very close."],["Anna","Great, is there a bus stop nearby too?"],["Marcos","Yes, there's one right at the corner."]],
  listenQ:[{q:"Is there a supermarket nearby?",opts:[["Yes",1],["No",0]]},{q:"How many pharmacies are there?",opts:[["Two",1],["One",0]]},{q:"Is there a bus stop nearby?",opts:[["Yes",1],["No",0]]}],
  readingHtml:"<mark>There is</mark> a small park near Marcos's house. <mark>There are</mark> many trees and <mark>there is</mark> a nice bench where he reads books in the afternoon. <mark>There isn't</mark> much noise there, so it's a peaceful place to relax.",
  vocab:["nearby","pharmacy","bench","garden","noise","peaceful"],

  readingHtml:"<mark>This</mark> is Anna's favorite coin from Canada. <mark>Those</mark> photos on the wall are from her last trip. <mark>These</mark> souvenirs mean a lot to her. <mark>That</mark> mountain photo, in particular, reminds her of her favorite winter vacation.",

  readingHtml:"Marcos <mark>works</mark> at a bank. He <mark>starts</mark> at nine and <mark>finishes</mark> at five. His sister <mark>teaches</mark> English at a local school every morning. She <mark>loves</mark> her job and always <mark>has</mark> fun stories to share at dinner.",

12:{ topic:"Present Simple (negativo/perguntas)", title:"Present Simple — Negative & Questions", sub:"don't, doesn't e perguntas com do/does.",
  grammarTitle:"Negativa e perguntas",
  grammarHtml:"Negativa: <strong>don't/doesn't</strong> + verbo base (sem -s!). Perguntas: <strong>Do/Does</strong> + sujeito + verbo base? Erro comum: 'She doesn't likes' está errado — o certo é 'She doesn't like' (sem -s no verbo depois de doesn't).",

  challenge:[["São dez e meia agora.","It's half past ten now."],["A aula começa às oito e quinze.","The class starts at a quarter past eight."]],
  dialogue:[["Marcos","What time is it?"],["Anna","It's a quarter past eight."],["Marcos","What time does the movie start?"],["Anna","At half past nine."],["Marcos","So we have an hour to eat."],["Anna","Perfect, let's go now."]],
  listenQ:[{q:"What time is it now?",opts:[["8:15",1],["8:45",0]]},{q:"What time does the movie start?",opts:[["9:30",1],["9:15",0]]},{q:"How much time do they have to eat?",opts:[["An hour",1],["Half an hour",0]]}],
  readingHtml:"Marcos wakes up at <mark>seven o'clock</mark>. He has breakfast at a <mark>quarter past seven</mark> and leaves home at <mark>half past seven</mark> to arrive at work by nine. At <mark>noon</mark>, he takes a short lunch break.",
  vocab:["wakes up","breakfast","leaves","arrive","noon","break"],

14:{ topic:"Advérbios de frequência", title:"Adverbs of Frequency", sub:"always, usually, sometimes, never.",
  grammarTitle:"Advérbios de frequência",

  challenge:[["Eu quase nunca chego atrasado ao trabalho.","I rarely arrive late to work."],["Nós frequentemente estudamos juntos aos sábados.","We often study together on Saturdays."]],
  dialogue:[["Anna","Do you usually cook dinner?"],["Marcos","Yes, I always cook on weekdays."],["Anna","I sometimes cook, but I usually order food."],["Marcos","That's fun too!"],["Anna","Do you ever eat out?"],["Marcos","Rarely, maybe once a month."]],
  listenQ:[{q:"Does Marcos always cook?",opts:[["Yes, on weekdays",1],["No, never",0]]},{q:"What does Anna usually do?",opts:[["Order food",1],["Cook every day",0]]},{q:"How often does Marcos eat out?",opts:[["Rarely",1],["Every day",0]]}],
  readingHtml:"Marcos <mark>always</mark> cooks dinner on weekdays. Anna <mark>usually</mark> orders food, but she <mark>sometimes</mark> cooks on weekends. She <mark>never</mark> eats fast food, and she <mark>rarely</mark> eats out, maybe once a month.",
  vocab:["order","weekdays","weekends","fast food","eat out","once"],
  speak:"I always cook dinner, but I sometimes order food." },

15:{ topic:"Can / can't", title:"Can & Can't", sub:"Habilidade e permissão.",
  grammarTitle:"Can / can't",
  grammarHtml:"<strong>Can</strong> expressa habilidade, permissão ou possibilidade: I can swim. <strong>Can't</strong> é a negativa: She can't drive. Também usamos para pedir algo educadamente: Can you help me, please?",
  tip:"'Can' nunca leva -s na terceira pessoa: 'he cans' está errado; o correto é 'he can'.",
  examples:[["I can speak Portuguese.","Eu consigo falar português."],["She can't drive yet.","Ela ainda não sabe dirigir."],["Can you help me?","Você pode me ajudar?"],["We can meet tomorrow.","Nós podemos nos encontrar amanhã."],["Can I open the window?","Posso abrir a janela?"],["They can't come to the party.","Eles não podem vir à festa."]],
  fill:[["I "," can"," swim very well."],["He "," can't"," cook at all."],[""," Can"," you speak French?"],[""," Can"," I ask a question?"],["They "," can't"," come tonight."]],
  choice:[{q:"She ___ play the piano beautifully.",opts:[["can",1],["can't",0]]},{q:"___ you drive a car?",opts:[["Can",1],["Do",0]]},{q:"Polite request: '___ you pass the salt?'",opts:[["Can",1],["Are",0]]}],
  challenge:[["Você pode me ajudar com isso, por favor?","Can you help me with this, please?"],["Ela não consegue dirigir ainda, mas está aprendendo.","She can't drive yet, but she is learning."]],
  dialogue:[["Marcos","Can you play any instrument?"],["Anna","Yes, I can play the guitar. Can you?"],["Marcos","No, I can't, but I can sing!"],["Anna","That's great, let's play together."],["Marcos","Can we practice this weekend?"],["Anna","Sure, I can meet you on Saturday."]],
  listenQ:[{q:"Can Anna play the guitar?",opts:[["Yes",1],["No",0]]},{q:"Can Marcos play an instrument?",opts:[["No, but he can sing",1],["Yes, the guitar",0]]},{q:"When can Anna meet?",opts:[["Saturday",1],["Sunday",0]]}],
  readingHtml:"Anna <mark>can</mark> play the guitar very well. Marcos <mark>can't</mark> play any instrument, but he <mark>can</mark> sing. Together they <mark>can</mark> make good music. They <mark>can't</mark> practice every day, but they meet every weekend.",
  vocab:["instrument","guitar","sing","together","practice","meet"],
  speak:"I can't play guitar, but I can sing." },

16:{ topic:"Adjetivos descritivos", title:"Descriptive Adjectives", sub:"Descrevendo pessoas e coisas.",
  grammarTitle:"Adjetivos em inglês",
  grammarHtml:"Adjetivos ficam antes do substantivo e não mudam de forma (não têm plural/gênero): a tall man, tall women. Também podem vir depois de 'to be': She is tall.",
  tip:"Ordem dos adjetivos em inglês segue uma sequência: opinião, tamanho, idade, forma, cor, origem, material. Ex: 'a beautiful small old round Brazilian wooden table'.",
  examples:[["She is tall and friendly.","Ela é alta e simpática."],["It's a small, old house.","É uma casa pequena e antiga."],["He is very funny.","Ele é muito engraçado."],["This coffee is too hot.","Este café está quente demais."],["That's an interesting idea.","Essa é uma ideia interessante."],["They live in a beautiful old house.","Eles moram numa bela casa antiga."]],
  fill:[["She has "," long"," hair."],["It's a "," big"," city."],["He is very "," kind","."],["This is an "," interesting"," book."],["It's a "," beautiful"," old house."]],
  choice:[{q:"The opposite of 'big' is:",opts:[["small",1],["tall",0]]},{q:"The opposite of 'happy' is:",opts:[["sad",1],["funny",0]]},{q:"The opposite of 'expensive' is:",opts:[["cheap",1],["hot",0]]}],
  challenge:[["Ele é um homem alto, simpático e engraçado.","He is a tall, friendly, and funny man."],["Essa é uma casa antiga e bonita.","That's a beautiful old house."]],
  dialogue:[["Anna","What is Marcos like?"],["Friend","He's tall, friendly, and very funny."],["Anna","And is he a hard worker?"],["Friend","Yes, he's very organized too."],["Anna","Sounds like a great person."],["Friend","He really is!"]],
  listenQ:[{q:"How is Marcos described?",opts:[["Tall, friendly, funny",1],["Short and quiet",0]]},{q:"Is he organized?",opts:[["Yes",1],["No",0]]},{q:"What does Anna think about him?",opts:[["He sounds great",1],["He sounds boring",0]]}],
  readingHtml:"Marcos is <mark>tall</mark>, <mark>friendly</mark>, and <mark>funny</mark>. He is also very <mark>organized</mark> at work. Anna is <mark>creative</mark> and always has <mark>interesting</mark> ideas. Together, they make a <mark>great</mark> team.",
  vocab:["organized","creative","hard worker","kind","interesting","team"],
  speak:"She is tall, friendly, and very creative." },

17:{ topic:"Família e relações", title:"Family & Relationships", sub:"Vocabulário de família e posse.",
  grammarTitle:"Vocabulário de família",
  grammarHtml:"Vocabulário essencial: parents (pais), mother/father, brother/sister, grandmother/grandfather, aunt/uncle, cousin, niece/nephew, in-laws (parentes por casamento, como sogra/sogro).",
  tip:"'Parents' significa apenas 'pai e mãe', nunca 'parentes' em geral — para isso usamos 'relatives'. É um falso cognato clássico!",
  examples:[["My mother is a teacher.","Minha mãe é professora."],["His grandfather is 80 years old.","O avô dele tem 80 anos."],["Her aunt lives in Rio.","A tia dela mora no Rio."],["Our cousins visit every summer.","Nossos primos visitam todo verão."],["I have many relatives in Brazil.","Eu tenho muitos parentes no Brasil."],["My niece is very smart.","Minha sobrinha é muito inteligente."]],
  fill:[["My "," mother"," is a doctor."],["His "," grandfather"," is very old."],["Her "," aunt"," lives in Rio."],["I have many "," relatives"," in Brazil."],["My "," niece"," is very smart."]],
  choice:[{q:"Your mother's sister is your:",opts:[["aunt",1],["cousin",0]]},{q:"Your father's father is your:",opts:[["uncle",0],["grandfather",1]]},{q:"'Parentes' in general (not just mom/dad):",opts:[["parents",0],["relatives",1]]}],
  challenge:[["Eu tenho muitos parentes que moram longe.","I have many relatives who live far away."],["Minha sobrinha visita a gente todo verão.","My niece visits us every summer."]],
  dialogue:[["Marcos","Do you have a big family?"],["Anna","Yes! I have two aunts, three uncles, and many cousins."],["Marcos","Do you see them often?"],["Anna","We meet every Christmas."],["Marcos","That must be a big reunion!"],["Anna","It is, over twenty relatives in one house!"]],
  listenQ:[{q:"How many aunts does Anna have?",opts:[["Two",1],["Three",0]]},{q:"When does the family meet?",opts:[["Every Christmas",1],["Every summer",0]]},{q:"How many relatives come to the reunion?",opts:[["Over twenty",1],["Ten",0]]}],
  readingHtml:"Anna has a big family: two <mark>aunts</mark>, three <mark>uncles</mark>, and many <mark>cousins</mark>. Every Christmas, her whole <mark>family</mark> meets at her <mark>grandmother's</mark> house — over twenty <mark>relatives</mark> in one place.",
  vocab:["aunts","uncles","cousins","grandmother","relatives","reunion"],
  speak:"My family meets every Christmas at my grandmother's house." },

18:{ topic:"Quantificadores", title:"Some, Any, A lot of", sub:"Falando sobre quantidades.",
  grammarTitle:"Some / any / a lot of / a little / a few",
  grammarHtml:"<strong>Some</strong> em frases afirmativas, <strong>any</strong> em negativas/perguntas. <strong>A lot of</strong> = muito(s), funciona com contáveis e incontáveis. <strong>A little</strong> = um pouco (incontáveis: a little sugar). <strong>A few</strong> = alguns (contáveis: a few friends).",
  tip:"'Little' sozinho (sem 'a') tem sentido negativo — 'I have little time' significa 'quase não tenho tempo', diferente de 'a little time' (um pouco de tempo, neutro).",
  examples:[["I have some money.","Eu tenho um pouco de dinheiro."],["There isn't any milk.","Não há leite nenhum."],["She has a lot of friends.","Ela tem muitos amigos."],["We need a little sugar.","Precisamos de um pouco de açúcar."],["I have a few questions.","Eu tenho algumas perguntas."],["He has very little time.","Ele tem pouquíssimo tempo."]],
  fill:[["I have "," some"," questions."],["There isn't "," any"," bread."],["She has "," a lot"," of books."],["We need "," a little"," sugar."],["I have "," a few"," friends here."]],
  choice:[{q:"Do you have ___ time today?",opts:[["some",0],["any",1]]},{q:"He has ___ money (not much).",opts:[["a little",1],["a lot of",0]]},{q:"I have ___ friends in this city (some, countable).",opts:[["a few",1],["a little",0]]}],
  challenge:[["Nós temos algumas perguntas para você.","We have a few questions for you."],["Ela tem muito pouco tempo livre.","She has very little free time."]],
  dialogue:[["Marcos","Do we have any coffee left?"],["Anna","Yes, we have some, but not a lot."],["Marcos","Ok, I'll buy a little more."],["Anna","Good idea, thanks!"],["Marcos","Do we need anything else?"],["Anna","Just a few eggs, I think."]],
  listenQ:[{q:"Is there a lot of coffee?",opts:[["No, just some",1],["Yes, a lot",0]]},{q:"What will Marcos do?",opts:[["Buy more coffee",1],["Nothing",0]]},{q:"What else do they need?",opts:[["A few eggs",1],["A lot of milk",0]]}],
  readingHtml:"They have <mark>some</mark> coffee, but not <mark>a lot</mark>. Marcos doesn't have <mark>any</mark> plans today, so he will buy <mark>a little</mark> more coffee at the market, plus <mark>a few</mark> eggs for breakfast.",
  vocab:["market","plans","left","buy","eggs","enough"],
  speak:"We have some coffee, but not a lot." },

19:{ topic:"Pronomes objeto", title:"Object Pronouns", sub:"me, him, her, us, them.",
  grammarTitle:"Pronomes objeto",
  grammarHtml:"Usados depois do verbo ou de uma preposição: me, you, him, her, it, us, them. Ex: I see him. She calls me. Give it to us.",
  tip:"Não confunda sujeito (he, she, they) com objeto (him, her, them) — 'Me and him went' está errado; o correto é 'He and I went'.",
  examples:[["She calls me every day.","Ela me liga todos os dias."],["I see him at work.","Eu o vejo no trabalho."],["We invited them to dinner.","Nós os convidamos para jantar."],["Can you help us?","Você pode nos ajudar?"],["Give it to her, please.","Dê isso a ela, por favor."],["Listen to me carefully.","Me escute com atenção."]],
  fill:[["She calls "," me"," every day."],["I see "," him"," at school."],["Can you help "," us","?"],["Give it "," to"," her, please."],["Listen "," to"," me carefully."]],
  choice:[{q:"I know Anna. I see ___ often.",opts:[["her",1],["him",0]]},{q:"They are my friends. I trust ___.",opts:[["they",0],["them",1]]},{q:"He and ___ went to the party.",opts:[["I",1],["me",0]]}],
  challenge:[["Ela me convidou para o jantar dela.","She invited me to her dinner."],["Você pode dar isso a eles, por favor?","Can you give it to them, please?"]],
  dialogue:[["Anna","Can you call me tonight?"],["Marcos","Sure, I'll call you at eight."],["Anna","Great, and can you invite them too?"],["Marcos","Yes, I'll invite them right now."],["Anna","Perfect, tell them to bring snacks."],["Marcos","I'll tell them right away."]],
  listenQ:[{q:"What time will Marcos call?",opts:[["Eight",1],["Nine",0]]},{q:"Will he invite them?",opts:[["Yes",1],["No",0]]},{q:"What should the guests bring?",opts:[["Snacks",1],["Drinks",0]]}],
  readingHtml:"Anna asked Marcos to call <mark>her</mark> tonight. He will call <mark>her</mark> at eight and invite <mark>them</mark> — their friends — to the party too. He will also tell <mark>them</mark> to bring snacks for everyone.",
  vocab:["invite","tonight","party","call","snacks","guests"],
  speak:"I'll call you at eight and invite them too." },

20:{ topic:"Present Continuous", title:"Present Continuous", sub:"O que está acontecendo agora.",
  grammarTitle:"Present Continuous (be + -ing)",
  grammarHtml:"Usamos para ações acontecendo agora: am/is/are + verbo-ing. Ex: I am studying now. Também usamos para planos futuros já combinados: We are meeting tomorrow.",
  tip:"Alguns verbos (como 'know', 'like', 'want', 'believe') quase nunca são usados no continuous, mesmo referindo-se ao presente — dizemos 'I know' e não 'I am knowing'.",
  examples:[["I am studying English now.","Estou estudando inglês agora."],["She is cooking dinner.","Ela está cozinhando o jantar."],["They are watching a movie.","Eles estão assistindo a um filme."],["We are waiting for the bus.","Estamos esperando o ônibus."],["I am meeting Anna tomorrow.","Vou me encontrar com a Anna amanhã."],["He is not listening.","Ele não está prestando atenção."]],
  fill:[["I am "," studying"," right now."],["She is "," cooking"," dinner."],["They are "," watching"," TV."],["We are "," waiting"," for the bus."],["He is "," not"," listening."]],
  choice:[{q:"Right now, he ___ (work).",opts:[["is working",1],["works",0]]},{q:"We ___ (wait) for you.",opts:[["are waiting",1],["wait",0]]},{q:"I ___ (know) the answer. (state verb — no -ing)",opts:[["know",1],["am knowing",0]]}],
  challenge:[["Ela está estudando inglês agora mesmo.","She is studying English right now."],["Eu vou me encontrar com meus amigos amanhã.","I am meeting my friends tomorrow."]],
  dialogue:[["Marcos","What are you doing right now?"],["Anna","I'm cooking dinner. What about you?"],["Marcos","I'm studying for my English class."],["Anna","Nice! Are you enjoying it?"],["Marcos","Yes, I'm learning a lot these days."],["Anna","That's great to hear!"]],
  listenQ:[{q:"What is Anna doing?",opts:[["Cooking dinner",1],["Studying",0]]},{q:"What is Marcos doing?",opts:[["Studying English",1],["Watching TV",0]]},{q:"Is Marcos enjoying his classes?",opts:[["Yes",1],["No",0]]}],
  readingHtml:"Right now, Anna <mark>is cooking</mark> dinner while Marcos <mark>is studying</mark> English. Outside, it <mark>is raining</mark>, and their neighbors <mark>are walking</mark> their dog in the rain. Marcos <mark>is learning</mark> a lot these days.",
  vocab:["raining","neighbors","enjoying","outside","learning","these days"],
  speak:"I'm studying English, and it's raining outside." },

21:{ topic:"Comparativos", title:"Comparatives", sub:"Comparando duas coisas.",
  grammarTitle:"Adjetivos comparativos",
  grammarHtml:"Adjetivos curtos (1 sílaba): +er (taller). Adjetivos longos (2+ sílabas): more + adjetivo (more interesting). Irregulares: good→better, bad→worse, far→farther. Use 'than' para comparar duas coisas.",
  tip:"Adjetivos terminados em 'y' trocam o y por 'ier': happy → happier, easy → easier.",
  examples:[["Marcos is taller than Anna.","Marcos é mais alto que Anna."],["This book is more interesting than that one.","Este livro é mais interessante que aquele."],["Today is worse than yesterday.","Hoje está pior que ontem."],["English is easier than Chinese for me.","Inglês é mais fácil que chinês para mim."],["She is happier now.","Ela está mais feliz agora."],["This is a better idea than mine.","Esta é uma ideia melhor que a minha."]],
  fill:[["He is "," taller"," than me."],["This is "," more"," interesting than that."],["Today is "," better"," than yesterday."],["She is "," happier"," now."],["This city is "," bigger"," than mine."]],
  choice:[{q:"Comparative of 'big':",opts:[["bigger",1],["more big",0]]},{q:"Comparative of 'expensive':",opts:[["expensiver",0],["more expensive",1]]},{q:"Comparative of 'happy':",opts:[["happyer",0],["happier",1]]}],
  challenge:[["Este restaurante é melhor que aquele.","This restaurant is better than that one."],["Ela é mais organizada que eu.","She is more organized than me."]],
  dialogue:[["Anna","Is Portuguese harder than English?"],["Marcos","For me, English is harder than Portuguese."],["Anna","Really? I think Portuguese is more difficult!"],["Marcos","Maybe it's easier for native speakers."],["Anna","True, practice makes it easier over time."],["Marcos","I agree, I'm getting better every day."]],
  listenQ:[{q:"What does Marcos think is harder?",opts:[["English",1],["Portuguese",0]]},{q:"What does Anna think?",opts:[["Portuguese is harder",1],["English is harder",0]]},{q:"Is Marcos improving?",opts:[["Yes",1],["No",0]]}],
  readingHtml:"For Marcos, English is <mark>harder</mark> than Portuguese. For Anna, Portuguese is <mark>more difficult</mark> than English. Learning is always <mark>easier</mark> with practice and a <mark>better</mark> routine. Marcos feels <mark>happier</mark> and more confident every day.",
  vocab:["harder","native speaker","practice","routine","confident","improving"],
  speak:"English is harder for me than Portuguese." },

22:{ topic:"Superlativos", title:"Superlatives", sub:"O mais / a mais de um grupo.",
  grammarTitle:"Adjetivos superlativos",
  grammarHtml:"Curtos: the + adj + est (the tallest). Longos: the most + adj (the most interesting). Irregulares: the best, the worst, the farthest. Sempre usa 'the' antes do superlativo.",
  tip:"Superlativo compara um item com TODO um grupo (3 ou mais), enquanto comparativo compara só dois itens — não confunda os contextos.",
  examples:[["Marcos is the tallest in his family.","Marcos é o mais alto da família."],["This is the most interesting book I've read.","Este é o livro mais interessante que já li."],["It was the best day ever.","Foi o melhor dia de todos."],["That was the worst movie.","Aquele foi o pior filme."],["This is the cheapest option.","Esta é a opção mais barata."],["She is the youngest in the group.","Ela é a mais jovem do grupo."]],
  fill:[["He is the "," tallest"," in his class."],["This is the "," most"," beautiful city."],["It was the "," best"," trip ever."],["This is the "," cheapest"," option."],["She is the "," youngest"," here."]],
  choice:[{q:"Superlative of 'fast':",opts:[["fastest",1],["most fast",0]]},{q:"Superlative of 'good':",opts:[["goodest",0],["best",1]]},{q:"Superlative of 'cheap':",opts:[["cheapest",1],["most cheap",0]]}],
  challenge:[["Este é o melhor café da cidade.","This is the best coffee in the city."],["Ela é a estudante mais dedicada da turma.","She is the most dedicated student in the class."]],
  dialogue:[["Anna","What's the best city you've visited?"],["Marcos","Rio, definitely. It's the most beautiful."],["Anna","For me, it's Vancouver, the most peaceful."],["Marcos","I'd love to visit it one day."],["Anna","You should! It's also the cleanest city I know."],["Marcos","Adding it to my list right now."]],
  listenQ:[{q:"Marcos's favorite city:",opts:[["Rio",1],["Vancouver",0]]},{q:"Anna's favorite city:",opts:[["Vancouver",1],["Rio",0]]},{q:"What else does Anna say about Vancouver?",opts:[["It's the cleanest",1],["It's the biggest",0]]}],
  readingHtml:"For Marcos, Rio is <mark>the most beautiful</mark> city he knows. For Anna, Vancouver is <mark>the most peaceful</mark> and <mark>the cleanest</mark> place she has visited. They agree travel gives <mark>the best</mark> memories of their lives.",
  vocab:["peaceful","memories","definitely","beautiful","cleanest","dedicated"],
  speak:"Rio is the most beautiful city I've visited." },

23:{ topic:"Imperativos e direções", title:"Directions", sub:"Dando instruções e pedindo direções.",
  grammarTitle:"Imperativo e direções",

  tip:"Para pedir direções educadamente, comece com 'Excuse me, could you tell me how to get to...?' em vez de ir direto ao imperativo.",

  fill:[[""," Turn"," left at the light."],[""," Go"," straight ahead."],["The shop is "," next"," to the bank."],["It's "," between"," the two buildings."],[""," Don't"," turn right here."]],
  choice:[{q:"'Vire à direita' in English:",opts:[["Turn right",1],["Turn left",0]]},{q:"'Em frente a' in English:",opts:[["Across from",1],["Next to",0]]},{q:"'Entre' (posição) in English:",opts:[["Between",1],["Behind",0]]}],
  challenge:[["Siga reto e vire à esquerda no semáforo.","Go straight and turn left at the traffic light."],["A farmácia fica entre o banco e a padaria.","The pharmacy is between the bank and the bakery."]],
  dialogue:[["Marcos","Excuse me, where is the post office?"],["Stranger","Go straight, then turn right at the bank."],["Marcos","Is it far from here?"],["Stranger","No, it's just two blocks away."],["Marcos","Thank you so much!"],["Stranger","You're welcome, have a good day!"]],
  listenQ:[{q:"Where should he turn right?",opts:[["At the bank",1],["At the park",0]]},{q:"How far is it?",opts:[["Two blocks",1],["Five blocks",0]]},{q:"How does Marcos react?",opts:[["He thanks the stranger",1],["He gets lost",0]]}],
  readingHtml:"To reach the post office, <mark>go straight</mark> for one block, then <mark>turn right</mark> at the bank. The post office is <mark>next to</mark> the pharmacy, <mark>across from</mark> the park, and <mark>between</mark> two small shops.",
  vocab:["post office","blocks","straight","stranger","between","reach"],
  speak:"Go straight, then turn right at the bank." },

24:{ topic:"Comida e would like", title:"Food & Would Like", sub:"Pedindo comida educadamente.",
  grammarTitle:"Would like (forma educada)",

  challenge:[["Eu gostaria de pedir a sopa e uma salada.","I'd like to order the soup and a salad."],["Você gostaria de se juntar a nós amanhã?","Would you like to join us tomorrow?"]],

  readingHtml:"At the café, Anna would like the <mark>chicken salad</mark>, and Marcos would like <mark>coffee</mark> and <mark>toast</mark>. The waiter writes down their <mark>order</mark> and asks if they would like anything else before bringing the <mark>bill</mark>.",
  vocab:["waiter","order","toast","salad","bill","anything else"],
  speak:"I'd like a coffee and toast, please." },

25:{ topic:"Clima e estações", title:"Weather & Seasons", sub:"Falando sobre o tempo e as estações do ano.",
  grammarTitle:"Vocabulário do clima",

/* ============ ESTADO / PROGRESSO (localStorage) ============ */
function loadState(){
  try{ const raw = localStorage.getItem('rotina-en-state'); if(raw) return JSON.parse(raw); }catch(e){}
  return { completed:[], streak:0, lastDate:null, currentDay:1 };
}
function saveState(){ localStorage.setItem('rotina-en-state', JSON.stringify(state)); }
let state = loadState();
let currentDay = state.currentDay || 1;
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function markDayComplete(day){
  if(!state.completed.includes(day)) state.completed.push(day);
  const today = todayStr();
  if(state.lastDate !== today){
    if(state.lastDate === yesterdayStr()){ state.streak += 1; } else { state.streak = 1; }
    state.lastDate = today;
  }
  saveState(); renderSidebar(); renderStreak(); renderLessonBody();
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const dayList = document.getElementById('dayList');
  dayList.innerHTML = '';
  for(let i=1; i<=TOTAL_DAYS; i++){
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'day-item' + (i===currentDay ? ' active' : '') + (state.completed.includes(i) ? ' done' : '');
    btn.innerHTML = `<span class="dot"></span><span class="n">${String(i).padStart(2,'0')}</span><span class="topic">${lessons[i].topic}</span>`;
    btn.addEventListener('click', () => selectDay(i));
    li.appendChild(btn);
    dayList.appendChild(li);
  }
  document.getElementById('progressLabel').textContent = `${state.completed.length}/${TOTAL_DAYS}`;
}
function renderStreak(){ document.getElementById('streakNum').textContent = state.streak; }
function selectDay(day){
  currentDay = day; state.currentDay = day; saveState();
  const d = lessons[day];
  document.getElementById('dayEyebrow').textContent = `Dia ${day} · ${day<=3?'Fundamentos':day<=23?'Nível A1':'Nível A1/A2'}`;
  document.getElementById('lessonTitle').textContent = d.title;
  document.getElementById('lessonSub').textContent = d.sub;
  document.getElementById('lessonContent').style.display = 'none';

  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ DIAL DE PROGRESSO ============ */
function renderDial(){
  const svgNS = "http://www.w3.org/2000/svg";
  const arcsGroup = document.getElementById('dialArcs');
  arcsGroup.innerHTML = '';
  const segments = [{ color:'#B23A2E', minutes:20 },{ color:'#C98F3F', minutes:20 },{ color:'#7A2620', minutes:10 }];
  const r=50, cx=60, cy=60, circumference = 2*Math.PI*r;
  let offset = 0;
  segments.forEach(seg => {
    const len = (seg.minutes/50) * circumference;
    const circle = document.createElementNS(svgNS,'circle');
    circle.setAttribute('cx',cx); circle.setAttribute('cy',cy); circle.setAttribute('r',r);
    circle.setAttribute('fill','none'); circle.setAttribute('stroke',seg.color); circle.setAttribute('stroke-width',12);
    circle.setAttribute('stroke-dasharray', `${len} ${circumference-len}`);
    circle.setAttribute('stroke-dashoffset', -offset);
    circle.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
    arcsGroup.appendChild(circle);
    offset += len;
  });
}

/* ============ TEXT-TO-SPEECH ============ */
function speak(text){
  if(!('speechSynthesis' in window)){ alert('Seu navegador não suporta síntese de voz.'); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US'; utter.rate = 0.92;
  speechSynthesis.cancel(); speechSynthesis.speak(utter);
}
function speakAll(day, i=0){
  const lines = lessons[day].dialogue;
  if(i >= lines.length || !('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(lines[i][1]);
  utter.lang = 'en-US'; utter.rate = 0.92;
  utter.onend = () => speakAll(day, i+1);
  speechSynthesis.speak(utter);
}

/* ============ CORREÇÃO DE EXERCÍCIOS ============ */
function checkFill(){
  const questions = document.querySelectorAll('#quizFill .q');
  let correct = 0;
  questions.forEach(q => {
    const answer = q.dataset.answer.trim().toLowerCase();
    const input = q.querySelector('.blank');
    const value = input.value.trim().toLowerCase();
    input.classList.remove('correct','wrong');
    if(value === answer){ input.classList.add('correct'); correct++; } else{ input.classList.add('wrong'); }
  });
  const fb = document.getElementById('feedback-quizFill');
  fb.textContent = `Você acertou ${correct} de ${questions.length}.`;
  fb.style.color = correct === questions.length ? '#4A7A45' : '#B23A2E';
}
function checkReorder(){
  const boxes = document.querySelectorAll('#quizReorder .reorder-box');
  let correct = 0;
  boxes.forEach(box => {
    const answer = box.dataset.answer.trim().toLowerCase();
    const input = box.querySelector('.reorder-input');
    const value = input.value.trim().toLowerCase().replace(/[.,!?]/g,'');
    input.style.borderColor = '';
    if(value === answer){ input.style.borderColor = 'var(--green)'; correct++; }
    else{ input.style.borderColor = 'var(--coral)'; }
  });
  const fb = document.getElementById('feedback-quizReorder');
  fb.textContent = `Você acertou ${correct} de ${boxes.length}.`;
  fb.style.color = correct === boxes.length ? '#4A7A45' : '#B23A2E';
}
function checkChoiceGroup(containerId, count, namePrefix){
  let correct = 0;
  for(let i=0;i<count;i++){
    const checked = document.querySelector(`input[name="${namePrefix}-${i}"]:checked`);
    if(checked && checked.value === 'correct') correct++;
  }
  const fb = document.getElementById('feedback-' + containerId);
  fb.textContent = `Você acertou ${correct} de ${count}.`;
  fb.style.color = correct === count ? '#4A7A45' : '#B23A2E';
}

/* ============ GRAVAÇÃO DE VOZ ============ */
let recognizing = false; let recognition;
function toggleRecord(targetPhrase){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('recordBtn'); const result = document.getElementById('speakResult');
  if(!SpeechRecognition){ result.textContent = 'Seu navegador não suporta reconhecimento de voz (funciona melhor no Chrome).'; return; }
  if(recognizing){ recognition.stop(); return; }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US'; recognition.interimResults = false;
  recognition.onstart = () => { recognizing = true; btn.classList.add('recording'); btn.textContent = '⏺ Gravando...'; result.textContent = 'Fale agora...'; };
  recognition.onend = () => { recognizing = false; btn.classList.remove('recording'); btn.textContent = '🎤 Gravar'; };
  recognition.onerror = () => { result.textContent = 'Não foi possível captar o áudio. Tente novamente.'; };
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript.toLowerCase().trim();
    const saidClean = said.replace(/[.,!?]/g,'');
    const similarity = wordOverlap(saidClean, targetPhrase);
    result.innerHTML = `Você disse: <strong>"${said}"</strong><br>Aproximação com a frase alvo: <strong>${similarity}%</strong>`;
  };
  recognition.start();
}
function wordOverlap(a,b){
  const wordsA = a.split(/\s+/); const wordsB = b.split(/\s+/);
  let matches = 0; wordsB.forEach(w => { if(wordsA.includes(w)) matches++; });
  return Math.round((matches/wordsB.length)*100);
}

const dictInput = document.getElementById('dictInput'); const dictResult = document.getElementById('dictResult');
let dictTimeout;
dictInput.addEventListener('input', () => {
  const word = dictInput.value.trim().toLowerCase().replace(/[.,!?']/g,'');
  clearTimeout(dictTimeout);
  if(!word){ dictResult.innerHTML = 'Traduzo qualquer palavra em inglês — na hora.'; return; }
  if(dictionary[word]){ dictResult.innerHTML = `<span class="found"><strong>${word}</strong> → ${dictionary[word]} <span class="src">(aula)</span></span>`; return; }
  dictResult.innerHTML = `<span class="loading">Traduzindo "${word}"...</span>`;
  dictTimeout = setTimeout(() => translateOnline(word), 450);
});
async function translateOnline(word){
  try{
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|pt-BR`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('network');
    const data = await res.json();
    const translated = data?.responseData?.translatedText;
    if(dictInput.value.trim().toLowerCase().replace(/[.,!?']/g,'') !== word) return;
    if(translated){ dictResult.innerHTML = `<span class="found"><strong>${word}</strong> → ${translated.toLowerCase()} <span class="src">(web)</span></span>`; }
    else{ dictResult.innerHTML = `<span class="not-found">Não encontrei tradução para "${word}".</span>`; }
  }catch(err){ dictResult.innerHTML = `<span class="not-found">Sem conexão com o tradutor agora. Tente novamente em instantes.</span>`; }
}
